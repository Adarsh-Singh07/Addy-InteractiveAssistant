name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/ubuntu/Addy-TheVoiceAssistant
            if [ ! -d ".git" ]; then
              echo "Git repository not found. Initializing Git..."
              git init
              git remote add origin https://github.com/Adarsh-Singh07/Addy-InteractiveAssistant.git
              git branch -M main
            fi
            git fetch origin
            git checkout -f main
            git reset --hard origin/main
            chmod +x deploy/deploy-backend.sh
            ./deploy/deploy-backend.sh
