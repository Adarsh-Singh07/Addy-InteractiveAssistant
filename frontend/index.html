<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Addy — Adarsh's personal AI voice assistant. Intelligent, multilingual, real-time." />
  <meta name="theme-color" content="#070b14" />
  <title>Addy — Voice AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

<!-- Top bar: connection status + admin lock -->
<div class="top-bar">
  <button id="admin-toggle-btn" class="admin-lock-btn" aria-label="Admin access">🔑</button>
  <div id="connection-badge" class="connection-badge" role="status" aria-live="polite">
    <div class="connection-dot" id="conn-dot"></div>
    <span id="conn-label">Connecting…</span>
  </div>
</div>

<!-- Main voice interface -->
<main class="voice-main" role="main">

  <!-- Central orb visualizer -->
  <div class="orb-container">
    <div class="orb-glow" id="orb-glow"></div>
    <div class="orb-rings" aria-hidden="true">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
    </div>
    <canvas id="orb-canvas" width="500" height="500" aria-hidden="true"></canvas>
  </div>

  <!-- Character identity -->
  <div class="char-identity">
    <h1 id="active-char-name" class="char-name">Addy</h1>
    <p id="active-char-desc" class="char-desc">Adarsh's AI Twin</p>
  </div>

  <!-- Status indicator -->
  <div class="status-display">
    <span id="status-value" class="status-value idle">Ready</span>
  </div>

  <!-- Microphone button -->
  <section class="mic-section">
    <button id="mic-btn" class="mic-btn" aria-label="Tap to speak" aria-pressed="false">
      <span class="mic-icon" id="mic-icon">🎙️</span>
    </button>
    <p class="mic-hint" id="mic-hint">Tap to speak</p>
  </section>

  <!-- Persona switcher tabs -->
  <nav class="persona-switcher" aria-label="Select persona">
    <button class="persona-tab active" id="btn-char-addy" data-char="addy">Addy</button>
    <button class="persona-tab" id="btn-char-nova" data-char="nova">Nova</button>
    <button class="persona-tab admin-only" id="btn-char-atlas" data-char="atlas" hidden>Atlas</button>
  </nav>

  <!-- Session controls (subtle) -->
  <div class="session-controls">
    <button id="btn-mute" class="ctrl-chip" aria-label="Mute microphone">🔇 Mute</button>
    <button id="btn-interrupt" class="ctrl-chip" aria-label="Interrupt">✋ Stop</button>
    <button id="btn-clear" class="ctrl-chip danger" aria-label="Clear conversation">🗑️ Clear</button>
  </div>

  <!-- Live transcript overlay -->
  <div class="transcript-area">
    <div class="transcript-interim" id="interim-text"></div>
    <div class="transcript-scroll" id="transcript-scroll" role="log" aria-live="polite"></div>
  </div>

  <!-- Provider status strip (hidden, inside settings) -->
  <div id="provider-strip" class="provider-strip" hidden></div>

</main>

<!-- Floating gear button -->
<button class="gear-btn" id="gear-btn" aria-label="Settings" title="Settings">⚙️</button>

<!-- Settings side panel -->
<aside id="settings-panel" class="settings-panel" aria-label="Settings">
  <div class="settings-header">
    <span>Configuration</span>
    <button id="settings-close" class="settings-close" aria-label="Close settings">✕</button>
  </div>
  <div class="settings-body">

    <!-- Voice Model -->
    <div class="setting-row">
      <label>Voice Model</label>
      <div class="segmented-control">
        <button class="seg-btn active" id="btn-model-31" data-model="gemini-3.1-flash-live-preview">3.1 Live</button>
        <button class="seg-btn" id="btn-model-25" data-model="gemini-2.5-flash-native-audio-preview-12-2025">2.5 Live</button>
      </div>
    </div>

    <!-- Voice picker -->
    <div class="setting-row">
      <label for="voice-select">Voice</label>
      <select id="voice-select">
        <option value="Aoede">Aoede (Addy — Female)</option>
        <option value="Kore">Kore (Nova — Female)</option>
        <option value="Charon">Charon (Atlas — Male)</option>
        <option value="Puck">Puck (Male)</option>
        <option value="Fenrir">Fenrir (Male)</option>
      </select>
    </div>

    <!-- Thinking budget -->
    <div class="setting-row" id="row-thinking-level">
      <label for="thinking-level-select">Thinking Budget</label>
      <select id="thinking-level-select">
        <option value="minimal">Minimal</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </div>

    <!-- Affective dialogue -->
    <div class="setting-row" id="row-affective">
      <label for="affective-checkbox">Affective Dialogue</label>
      <label class="switch">
        <input type="checkbox" id="affective-checkbox" />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Pipeline mode -->
    <div class="setting-row">
      <label for="engine-select">Pipeline Mode</label>
      <select id="engine-select">
        <option value="gemini_live">Gemini Live (Primary)</option>
        <option value="cascaded">Deepgram Cascaded (Fallback)</option>
      </select>
    </div>

    <!-- Latency metrics (admin/debug) -->
    <div class="latency-section">
      <div class="latency-label">Latency</div>
      <div class="metrics-grid">
        <div class="metric-item">E2E: <span id="latency-e2e">—</span>ms</div>
        <div class="metric-item">STT: <span id="latency-stt">—</span>ms</div>
        <div class="metric-item">LLM: <span id="latency-llm">—</span>ms</div>
        <div class="metric-item">TTS: <span id="latency-tts">—</span>ms</div>
      </div>
    </div>

  </div>
</aside>

<!-- Admin login modal -->
<div id="admin-login-modal" class="admin-modal hidden" aria-modal="true" role="dialog">
  <div class="admin-modal-content">
    <button id="admin-modal-close" class="admin-close-btn" aria-label="Close">✕</button>
    <div class="admin-modal-icon">🔐</div>
    <h2>System Access</h2>
    <p>Enter the administrator passcode to unlock Atlas and Hermes capabilities.</p>
    <input type="password" id="admin-passcode-input" placeholder="Passcode" autocomplete="current-password" />
    <button id="admin-submit-btn" class="admin-submit-btn">Authorize</button>
    <div id="admin-login-error" class="admin-error hidden"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/voice.js"></script>
</body>
</html>
